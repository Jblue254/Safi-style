{% extends 'base.html' %}

{% block content %}

<div class="max-w-md mx-auto mt-12">

    <div class="bg-white shadow-lg rounded-2xl p-8">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900">
                Create Account
            </h2>

            <p class="text-gray-500 mt-2">
                Join Safi Style today
            </p>
        </div>

        <form method="POST" class="space-y-5">

            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password1"
                    placeholder="Create a password"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="password2"
                    placeholder="Confirm your password"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300"
            >
                Create Account
            </button>

        </form>

        <div class="text-center mt-6">
            <p class="text-gray-600">
                Already have an account?
                <a href="{% url 'login' %}"
                   class="text-indigo-600 font-semibold hover:text-indigo-800">
                    Login
                </a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
