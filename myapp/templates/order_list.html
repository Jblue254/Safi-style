{% extends 'base.html' %}

{% block content %}

<h1>My Orders</h1>

{% for order in orders %}

    <h3>Order #{{ order.id }}</h3>

    <ul>
        {% for item in order.orderitem_set.all %}
            <li>
                {{ item.product.name }}
                (Qty: {{ item.quantity }})
            </li>
        {% endfor %}
    </ul>

{% empty %}

    <p>No Orders Found</p>

{% endfor %}

{% endblock %}
