{% extends 'base.html' %}

{% block content %}

<h1>Buy {{ product.name }}</h1>

<p>Price: Ksh {{ product.price }}</p>

<form method="POST">
    {% csrf_token %}

    <label>Quantity:</label>

    <input
        type="number"
        name="quantity"
        min="1"
        value="1"
        required
    >

    <button type="submit">
        Place Order
    </button>
</form>

{% endblock %}
