{% extends 'base.html' %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <!-- Page Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-900">
            Place Your Order
        </h1>

        <p class="text-gray-500 mt-2">
            Complete your purchase below.
        </p>
    </div>

    <!-- Order Card -->
    <div class="bg-white shadow-lg rounded-2xl overflow-hidden">

        <!-- Product Info -->
        <div class="p-8">

            <h2 class="text-2xl font-bold text-gray-900 mb-4">
                {{ product.name }}
            </h2>

            <p class="text-3xl font-bold text-indigo-600 mb-6">
                Ksh {{ product.price }}
            </p>

            <form method="POST" class="space-y-6">

                {% csrf_token %}

                <div>
                    <label
                        for="quantity"
                        class="block text-sm font-medium text-gray-700 mb-2"
                    >
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="1"
                        value="1"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition duration-300"
                >
                    Place Order
                </button>

            </form>

        </div>

    </div>

    <!-- Back Button -->
    <div class="mt-6 text-center">
        <a href="{% url 'product_detail' product.id %}"
           class="text-indigo-600 hover:text-indigo-800 font-medium">
            Back to Product
        </a>
    </div>

</div>

{% endblock %}
