<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safi Style Store</title>

```
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
```

</head>

<body class="bg-gray-50 text-gray-800 min-h-screen">

```
<!-- Navigation -->
<nav class="bg-white shadow-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

        <!-- Logo -->
        <a href="/" class="text-2xl font-bold text-indigo-600">
            Safi Style
        </a>

        <!-- Navigation Links -->
        <div class="flex items-center gap-6">

            <a href="/"
               class="text-gray-600 hover:text-indigo-600 font-medium transition">
                Home
            </a>

            {% if user.is_authenticated %}

                <a href="/orders/"
                   class="text-gray-600 hover:text-indigo-600 font-medium transition">
                    My Orders
                </a>

                <span class="text-sm text-gray-500">
                    Welcome, <strong class="text-gray-800">{{ user.username }}</strong>
                </span>

                <a href="{% url 'logout' %}"
                   class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                    Logout
                </a>

            {% else %}

                <a href="/login/"
                   class="text-gray-600 hover:text-indigo-600 font-medium transition">
                    Login
                </a>

                <a href="/register/"
                   class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                    Register
                </a>

            {% endif %}

        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="max-w-6xl mx-auto px-6 py-10">

    {% block content %}
    {% endblock %}

</main>

<footer class="bg-indigo-950 text-indigo-200 py-8 mt-10">
    <div class="max-w-6xl mx-auto px-6 text-center">

        <h3 class="text-xl font-bold text-white mb-2">
            Safi Style
        </h3>

        <p class="text-sm text-indigo-300">
            Quality products. Simple shopping.
        </p>

        <div class="border-t border-indigo-800 mt-6 pt-5">
            <p class="text-sm text-indigo-400">
                &copy; 2026 Safi Style Store. All rights reserved.
            </p>
        </div>

    </div>
</footer>

</body>
</html>
