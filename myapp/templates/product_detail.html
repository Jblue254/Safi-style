{% extends 'base.html' %}

{% block content %}

<!-- Product Detail -->

<div class="max-w-4xl mx-auto">


<!-- Back Button -->
<div class="mb-6">
    <a href="/"
       class="inline-flex items-center text-indigo-600 font-semibold hover:text-indigo-800 transition">
        Back to Products
    </a>
</div>

<!-- Product Card -->
<div class="bg-white rounded-2xl shadow-md overflow-hidden">

    <!-- Product Header -->
    <div class="bg-indigo-50 h-64 flex items-center justify-center">
        
    </div>

    <!-- Product Information -->
    <div class="p-8">

        <h1 class="text-4xl font-bold text-gray-900 mb-4">
            {{ product.name }}
        </h1>

        <p class="text-3xl font-bold text-indigo-600 mb-6">
            Ksh {{ product.price }}
        </p>

        <!-- Category -->
        <div class="mb-8">
            <p class="text-sm text-gray-500 mb-1">
                Category
            </p>

            <p class="text-lg font-semibold text-gray-800">
                {{ product.category }}
            </p>
        </div>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-4">

            {% if user.is_authenticated %}

                <a href="{% url 'create_order' product.id %}"
                   class="flex-1 text-center bg-green-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                    Buy Now
                </a>

            {% else %}

                <a href="{% url 'login' %}"
                   class="flex-1 text-center bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                    Login to Buy
                </a>

            {% endif %}

            <a href="/"
               class="flex-1 text-center border border-indigo-600 text-indigo-600 px-6 py-3 rounded-lg font-semibold hover:bg-indigo-50 transition">
                Back to Products
            </a>

        </div>

    </div>

</div>


</div>

{% endblock %}
