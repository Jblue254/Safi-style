{% extends 'base.html' %}

{% block content %}

<div class="max-w-3xl mx-auto">

```
<!-- Back Link -->
<a href="/" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 font-medium mb-8">
    ← Back to Products
</a>

<!-- Product Card -->
<div class="bg-white rounded-2xl shadow-lg overflow-hidden">

    <!-- Product Header -->
    <div class="bg-indigo-50 py-12 text-center">
        <div class="text-7xl mb-4">🛍️</div>

        <h1 class="text-4xl font-bold text-gray-900">
            {{ product.name }}
        </h1>
    </div>

    <!-- Product Details -->
    <div class="p-8">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">

            <div class="bg-gray-50 rounded-xl p-5">
                <p class="text-sm text-gray-500 mb-1">Price</p>
                <p class="text-2xl font-bold text-indigo-600">
                    Ksh {{ product.price }}
                </p>
            </div>

            <div class="bg-gray-50 rounded-xl p-5">
                <p class="text-sm text-gray-500 mb-1">Category</p>
                <p class="text-lg font-semibold text-gray-900">
                    {{ product.category }}
                </p>
            </div>

        </div>

        <!-- Action -->
        <a href="/"
           class="block text-center bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
            Continue Shopping
        </a>

    </div>

</div>
```

</div>

{% endblock %}
