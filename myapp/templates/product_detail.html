<!DOCTYPE html>
<html>
<head>
    <title>Product Detail</title>
</head>
<body>

<h1>{{ product.name }}</h1>

<p>Price: Ksh {{ product.price }}</p>

<p>Category: {{ product.category }}</p>

{% if user.is_authenticated %}
    <a href="{% url 'create_order' product.id %}">
        Buy Now
    </a>
{% else %}
    <a href="{% url 'login' %}">
        Login to Buy
    </a>
{% endif %}

</body>
</html>
